##################################################################
# PACKAGING
##################################################################

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sass_public"
dependencies = [
    # openeye-toolkits comes from the OpenEye index. For pip, add it as in config/pip.conf.
    # Pinned because ROCS scores shift slightly between releases. Regenerate
    # tests/data/expected_rocs_scores.json when this pin changes.
    "openeye-toolkits==2026.1.0",
    "dask",
    "dask-jobqueue",
    "pandas",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "pyyaml",
    "seaborn",
    "typer",
]
requires-python = ">=3.11,<3.12"
authors = [
    {name = "Chen Cheng", email = "cheng.chen.cc6@gene.com"},
]
dynamic = ["version", "readme"]
description = "Shape-Aware Synthon Search"
license = "Apache-2.0"
keywords = ["sass"]
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
]

[project.urls]
Repository = "https://github.com/Genentech/SASS.git"

[project.scripts]
sass = "sass.cli:app"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["sass*"]
namespaces = false

[tool.setuptools.package-data]
# List any new package resource here.
sass = ["config_template.yml", "libraries.yml"]

[tool.setuptools.dynamic]
version = {attr = "sass.__version__"}
readme = {file = ["README.md"], content-type="text/markdown"}

##################################################################
# Development environment
##################################################################

[[tool.uv.index]]
name = "openeye"
url = "https://pypi.anaconda.org/OpenEye/simple/"
explicit = true

[tool.uv.sources]
openeye-toolkits = { index = "openeye" }

[dependency-groups]
dev = [
    "black==25.12.0",
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "pytest==9.0.2",
    "pytest-check==2.6.2",
    "pytest-cov==7.0.0",
    "pytest-timeout==2.4.0",
    "ruff==0.14.10",
    "scripttest==2.0.post1",
    # analysis notebooks and scripts:
    "ipykernel",
    "scipy",
    "tqdm",
]

##################################################################
# TESTING
##################################################################

[tool.pytest.ini_options]
timeout = 60
markers = [
    "integration: end-to-end pipeline run against the synthetic test library (minutes)",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = []

[tool.coverage.report]
omit = []

##################################################################
# LINTING
##################################################################

[tool.black]
line-length = 120

##################################################################

[tool.ruff]
# see: https://docs.astral.sh/ruff/
target-version = "py311"
line-length = 120
show-fixes = true
extend-exclude = [
]

[tool.ruff.lint]
# see: https://docs.astral.sh/ruff/linter/#rule-selection
select = [
    "A",      #  flake8-builtins
    "AIR",    #  Airflow
    "ANN",    #  flake8-annotations
    "ARG",    #  flake8-unused-arguments
    "ASYNC",  #  flake8-async
    "B",      #  flake8-bugbear
    "BLE",    #  flake8-blind-except
    "C4",     #  flake8-comprehensions
    "C90",    #  mccabe
#   "COM",    #  flake8-commas -- BLACK LINTING TAKES PRECEDENCE
#   "CPY",    #  flake8-copyright -- RUFF PREVIEW
    "D",      #  pydocstyle
    "DJ",     #  flake8-django
#   "DOC",    #  pydoclint -- RUFF PREVIEW
    "DTZ",    #  flake8-datetimez
    "E",      #  pycodestyle
    "EM",     #  flake8-errmsg
    "ERA",    #  eradicate
    "EXE",    #  flake8-executable
    "F",      #  Pyflakes
#   "FA",     #  flake8-future-annotations
    "FAST",   #  FastAPI
#   "FBT",    #  flake8-boolean-trap
    "FIX",    #  flake8-fixme
    "FLY",    #  flynt
    "FURB",   #  refurb
    "G",      #  flake8-logging-format
    "I",      #  isort
    "ICN",    #  flake8-import-conventions
    "INP",    #  flake8-no-pep420
    "INT",    #  flake8-gettext
    "ISC",    #  flake8-implicit-str-concat
    "LOG",    #  flake8-logging
    "N",      #  pep8-naming
    "NPY",    #  NumPy-specific
    "PD",     #  pandas-vet
    "PERF",   #  Perflint
    "PGH",    #  pygrep-hooks
    "PIE",    #  flake8-pie
    "PL",     #  Pylint
    "PT",     #  flake8-pytest-style
    "PTH",    #  flake8-use-pathlib
    "PYI",    #  flake8-pyi
    "Q",      #  flake8-quotes
    "RET",    #  flake8-return
    "RSE",    #  flake8-raise
    "RUF",    #  Ruff-specific
    "S",      #  flake8-bandit
    "SIM",    #  flake8-simplify
    "SLF",    #  flake8-self
    "SLOT",   #  flake8-slots
    "T10",    #  flake8-debugger
    "T20",    #  flake8-print
    "TC",     #  flake8-type-checking
    "TD",     #  flake8-todos
    "TID",    #  flake8-tidy-imports
    "TRY",    #  tryceratops
#   "UP",     #  pyupgrade
    "YTT",    #  flake8-2020
]

ignore = [
    #### flake8-annotations
    "ANN401",    # Dynamically typed expressions
    #### flake8-logging-format
    "G004",      # Logging statement uses f-string
    #### pydocstyle
    "D203",      # One blank line required before class docstring
    "D212",      # Multi-line docstring summary should start at the first line
    "D401",      # First line should be in imperative mood; try rephrasing
    "D406",      # Section name should end with a newline
    "D407",      # Missing dashed underline after section
    #### flake8-errmsg
    "EM101",     # Exception must not use a string literal, assign to variable first
    "EM102",     # Exception must not use an f-string literal, assign to variable first
    #### flake8-type-checking
    "TC003",     # Move standard library import `argparse` into a type-checking block
    #### tryceratops
    "TRY003",    # Avoid specifying long messages outside the exception class
    #### additional
    "ERA001",    # Found commented-out code
    "ANN201",    # Missing return type annotation for public function
    "D103",      # Missing docstring in public function
    "C901",      # function is too complex
    "PLR0912",   # Too many branches
    "PLR0915",   # Too many statements
    "S301",      # `pickle` and modules that wrap it can be unsafe when used to deserialize untrusted data, possible security issue
    "PLR0913",   # Too many arguments to function call
    "PLW0603",   # Using the global statement is discouraged.
    "D102",      # Missing docstring in public method
    "N806",      # Variable in function should be lowercase
    "N802",      # Function name should be lowercase
    "N803",      # Argument name should be lowercase
    "TD002",     # TODO-related
    "TD003",
    "FIX002",
    "B006",      # Do not use mutable data structures for argument defaults
    "SIM108",    # Use ternary operator instead of `if`-`else`-block
    "RET505",    # Unnecessary `else` after `return` statement
    "RET504",    # Unnecessary assignment of variable before `return` statement
    "RET508",    # Unnecessary `else` after `break` statement
    "RET503",    # Missing explicit `return` at the end of function able to return non-`None` value
    "S603",      # `subprocess` call: check for execution of untrusted input
]


[tool.ruff.lint.flake8-annotations]
# see: https://docs.astral.sh/ruff/settings/#flake8-quotes
allow-star-arg-any = true

[tool.ruff.lint.flake8-quotes]
# see: https://docs.astral.sh/ruff/settings/#flake8-quotes
docstring-quotes = "double"

[tool.ruff.lint.pylint]
# see: https://docs.astral.sh/ruff/settings/#pylint
max-branches = 12    # default: 12
max-returns = 6      # default: 6
max-statements = 50  # default: 50
max-args = 6         # default: 5
allow-magic-value-types = ["str", "bytes", "int"]  # default: ["str", "bytes"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
# see: https://docs.astral.sh/ruff/rules/#mccabe-c90
max-complexity = 10  # default: 10

[tool.ruff.lint.per-file-ignores]
# see: https://docs.astral.sh/ruff/settings/#per-file-ignores

"__init__.py" = [
    "F401",    # Imported but unused
    "I001",    # Import block is un-sorted or un-formatted
]

[tool.ruff.lint.isort]
# add additional in-house packages here so that isort
# will correctly put them in the 3rd sorting block
known-first-party = [
  "sass*",
]

##################################################################

[tool.mypy]
ignore_missing_imports = "True"
warn_return_any = "True"

